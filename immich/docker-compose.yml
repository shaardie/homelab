services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    volumes:
      - /mnt/immich/:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    networks:
      - proxy
      - internal

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - internal

  redis:
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - internal

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - internal

  immichframe:
    image: ghcr.io/immichframe/immichframe:v1.0.37.0
    restart: on-failure
    environment:
      TZ: "Europe/Berlin"
    env_file:
      - .immichframe.env
    depends_on:
      - immich-server
    networks:
      - internal
      - proxy

volumes:
  model-cache:
  postgres:

networks:
  internal:
  proxy:
    external: true
