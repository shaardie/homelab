services:
  navidrome:
    # https://github.com/navidrome/navidrome
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    volumes:
      - "data:/data"
      - "downloads:/music:ro"
    networks:
      - proxy
  deezer-downloader:
    #https://github.com/kmille/deezer-downloader
    image: kmille2/deezer-downloader:latest@sha256:3286e91b78463018003255d873c95f88685d4c9b6f09835e6fef742dc598db2f
    restart: unless-stopped
    env_file:
      - docker-compose.env
    volumes:
      - downloads:/mnt/deezer-downloader
    networks:
      - proxy

volumes:
  data:
  downloads:

networks:
  proxy:
    external: true
