services:
  listinator:
    image: ghcr.io/hacky-day/listinator@sha256:5f3c4416573d9041d51d9bb2344317ac26e0d9d2c77118bea701ab621072a614
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - data:/var/lib/listinator

  caddy:
    build: .
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  data:
